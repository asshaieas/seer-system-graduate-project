name: app
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0
  google_fonts: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/branding/seer_logo_inverse.png

  fonts:
    - family: Canva Sans
      fonts:
        - asset: assets/fonts/CanvaSans-Regular.otf
          weight: 400
        - asset: assets/fonts/CanvaSans-Medium.otf
          weight: 500
        - asset: assets/fonts/CanvaSans-Bold.otf
          weight: 700